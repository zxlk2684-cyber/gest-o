version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: serviceflow-db
    environment:
      POSTGRES_DB: serviceflow
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: serviceflow123
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serviceflow-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serviceflow-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: serviceflow
      DB_USER: serviceflow
      DB_PASSWORD: serviceflow123
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    networks:
      - serviceflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local

networks:
  serviceflow-network:
    driver: bridge
